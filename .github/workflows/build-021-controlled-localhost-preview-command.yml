name: Build 21 Controlled Localhost Preview Command

on:
  pull_request:
  push:
    branches:
      - main
      - agent/controlled-localhost-preview-command

permissions:
  contents: read

jobs:
  controlled-localhost-preview-command:
    name: Controlled localhost preview command checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check generated build state
        run: |
          node scripts/stealtheye-build.mjs scripts/phases/build-008-browserops.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-009-receipts-replay.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-010-mcp-runtime-devmode.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-011-live-readonly-repo-status.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-012-memory-graph.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-013-live-codeops-branch-write.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-014-official-mcp-server-transport.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-015-reachable-dev-deployment-endpoint.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-016-chatgpt-developer-mode-connection.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-017-core-control-plane-app.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-018-control-plane-ui-components.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-019-local-dev-ui-shell.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-020-mcp-resource-wiring-localhost-preview.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-021-controlled-localhost-preview-command.mjs --check

      - name: Verify Build 21 required files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/mcp-server/src/controlled-localhost-command.ts
            packages/mcp-server/src/developer-mode-resource-connection.ts
            packages/mcp-server/src/resource-registry.ts
            packages/mcp-server/src/index.ts
            packages/mcp-server/test/controlled-localhost-command.test.ts
            scripts/phases/build-021-controlled-localhost-preview-command.mjs
            docs/CONTROLLED_LOCALHOST_PREVIEW.md
            docs/DECISIONS/0023-controlled-localhost-preview-command.md
            docs/generated/build-021-manifest.json
            docs/generated/build-021-acceptance.md
            docs/generated/build-021-handoff.md
            docs/generated/build-021-receipt.json
            docs/generated/project-memory.json
            docs/generated/known-gaps.json
            docs/generated/safety-capability-matrix.json
            docs/generated/eval-registry.json
            docs/generated/tool-inventory.json
            docs/generated/build-state.json
            .github/workflows/build-021-controlled-localhost-preview-command.yml
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Verify protected docs are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          changed="$(git diff --name-only origin/main...HEAD -- README.md AGENTS.md docs/ARCHITECTURE.md || true)"
          if [ -n "$changed" ]; then
            echo "Protected docs changed unexpectedly:"
            echo "$changed"
            exit 1
          fi

      - name: Basic sensitive-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/build-021-controlled-localhost-preview-command.yml"
          aws_prefix="$(printf '\x41\x4b\x49\x41')"
          begin_word="$(printf '\x42\x45\x47\x49\x4e')"
          private_word="$(printf '\x50\x52\x49\x56\x41\x54\x45')"
          key_word="$(printf '\x4b\x45\x59')"
          secret_word="$(printf '\x73\x65\x63\x72\x65\x74')"
          pass_word="$(printf '\x70\x61\x73\x73\x77\x6f\x72\x64')"
          sensitive_patterns="(${aws_prefix}[0-9A-Z]{16}|${begin_word} (RSA|OPENSSH|EC|DSA) ${private_word} ${key_word}|${pass_word}=|client_${secret_word}=|${private_word}_${key_word}=)"
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f ! -path "$guard_file" -print0 | xargs -0 grep -InE "$sensitive_patterns"; then
            echo "Potential sensitive-like string found."
            exit 1
          fi

      - name: Verify no committed live app material
        shell: bash
        run: |
          set -euo pipefail
          scan_paths=(packages/mcp-server/src/controlled-localhost-command.ts packages/mcp-server/src/developer-mode-resource-connection.ts packages/mcp-server/src/resource-registry.ts docs/generated)
          live_url_pattern="https://[^[:space:]\"'<>]+[.](trycloudflare|ngrok|pages|workers|run|app)/"
          live_marker_pattern="app_id=|oauth_client=|tunnel_token=|cloud_account="
          if grep -RInE "${live_url_pattern}|${live_marker_pattern}" "${scan_paths[@]}"; then
            echo "Potential concrete live app material found."
            exit 1
          fi

      - name: Verify no remote asset script or style material
        shell: bash
        run: |
          set -euo pipefail
          scan_paths=(packages/mcp-server/src/controlled-localhost-command.ts packages/mcp-server/src/developer-mode-resource-connection.ts packages/mcp-server/src/resource-registry.ts docs/generated)
          if grep -RInE "https?://|<script[[:space:]][^>]*src=|<link[[:space:]][^>]*href=|cdn\." "${scan_paths[@]}"; then
            echo "Potential remote asset/script/style material found."
            exit 1
          fi

      - name: Verify no default server binding
        shell: bash
        run: |
          set -euo pipefail
          scan_paths=(packages/mcp-server/src/controlled-localhost-command.ts packages/mcp-server/src/developer-mode-resource-connection.ts packages/mcp-server/src/resource-registry.ts docs/generated)
          if grep -RInE "bind_by_default:[[:space:]]*true|bind_by_default\": true|listen\(|server\.listen" "${scan_paths[@]}"; then
            echo "Potential default server binding material found."
            exit 1
          fi

      - name: Verify no process start in CI or default mode
        shell: bash
        run: |
          set -euo pipefail
          scan_paths=(packages/mcp-server/src/controlled-localhost-command.ts packages/mcp-server/src/developer-mode-resource-connection.ts packages/mcp-server/src/resource-registry.ts docs/generated)
          if grep -RInE "child_process|spawn\(|execFile\(|exec\(|server\.listen|listen\(" "${scan_paths[@]}"; then
            echo "Potential process start or server binding material found."
            exit 1
          fi
