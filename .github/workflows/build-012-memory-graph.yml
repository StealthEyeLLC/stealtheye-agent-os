name: Build 12 Memory Graph Strict Sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-012-checks:
    name: Memory Graph strict generated-state checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report Build 12 scope
        run: |
          echo "Build 12 check: install, typecheck, tests, Build 8/9/10/11 generated-state checks, Build 12 strict generated-state check, required file checks, and basic secret-string guard."
          echo "This workflow does not claim production memory persistence, vector search, embeddings, customer-data readiness, private memory ingestion, durable storage, production deployment, live repo mutation, or full security scanning."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check generated build state including Build 12 strict sync
        run: |
          node scripts/stealtheye-build.mjs scripts/phases/build-008-browserops.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-009-receipts-replay.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-010-mcp-runtime-devmode.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-011-live-readonly-repo-status.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-012-memory-graph.mjs --check

      - name: Verify Build 12 required files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            packages/memory-graph/package.json packages/memory-graph/tsconfig.json packages/memory-graph/src/index.ts packages/memory-graph/src/schemas.ts packages/memory-graph/src/nodes.ts packages/memory-graph/src/edges.ts packages/memory-graph/src/provenance.ts packages/memory-graph/src/query.ts packages/memory-graph/src/compaction.ts packages/memory-graph/src/retention.ts packages/memory-graph/src/receipts.ts packages/memory-graph/src/fixtures.ts packages/memory-graph/test/memory-graph.test.ts
            packages/mcp-runtime/src/memory-graph-adapter.ts scripts/phases/build-012-memory-graph.mjs docs/MEMORY_GRAPH.md docs/DECISIONS/0014-memory-graph-foundation.md
            docs/generated/build-012-manifest.json docs/generated/build-012-acceptance.md docs/generated/build-012-handoff.md docs/generated/build-012-receipt.json docs/generated/project-memory.json docs/generated/known-gaps.json docs/generated/safety-capability-matrix.json docs/generated/eval-registry.json docs/generated/tool-inventory.json docs/generated/build-state.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Basic secret-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/build-012-memory-graph.yml"
          aws_prefix="$(printf '\x41\x4b\x49\x41')"
          begin_word="$(printf '\x42\x45\x47\x49\x4e')"
          private_word="$(printf '\x50\x52\x49\x56\x41\x54\x45')"
          key_word="$(printf '\x4b\x45\x59')"
          secret_word="$(printf '\x73\x65\x63\x72\x65\x74')"
          pass_word="$(printf '\x70\x61\x73\x73\x77\x6f\x72\x64')"
          secret_like_patterns="(${aws_prefix}[0-9A-Z]{16}|${begin_word} (RSA|OPENSSH|EC|DSA) ${private_word} ${key_word}|${pass_word}=|client_${secret_word}=|${private_word}_${key_word}=)"
          if find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -type f \
            ! -path "$guard_file" \
            -print0 | xargs -0 grep -InE "$secret_like_patterns"; then
            echo "Potential secret-like string found."
            exit 1
          fi
