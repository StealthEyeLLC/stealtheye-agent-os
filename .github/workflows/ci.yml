name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Scaffold and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report CI scope
        run: |
          echo "Build 8 CI: install, typecheck, tests, required files, basic secret-string guard, and generated build-state check."
          echo "This workflow does not claim full security scanning, SBOM/provenance, deployment readiness, live browser testing, credentialed browsing testing, Playwright runtime readiness, live queue testing, worker runtime readiness, or live GitHub mutation testing."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check generated build state
        run: node scripts/stealtheye-build.mjs scripts/phases/build-008-browserops.mjs --check

      - name: Verify required scaffold files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            llms.txt
            llms-full.txt
            package.json
            pnpm-workspace.yaml
            tsconfig.base.json
            packages/browserops/package.json
            packages/browserops/tsconfig.json
            packages/browserops/src/index.ts
            packages/browserops/src/schemas.ts
            packages/browserops/src/session.ts
            packages/browserops/src/page-state.ts
            packages/browserops/src/evidence.ts
            packages/browserops/src/action-policy.ts
            packages/browserops/src/action-plan.ts
            packages/browserops/src/preflight.ts
            packages/browserops/src/fixtures.ts
            packages/browserops/test/browserops.test.ts
            scripts/stealtheye-build.mjs
            scripts/phases/build-008-browserops.mjs
            docs/BROWSEROPS.md
            docs/BUILD_AUTOMATION.md
            docs/DECISIONS/0010-browserops-build-automation.md
            docs/generated/build-008-manifest.json
            docs/generated/build-008-acceptance.md
            docs/generated/build-008-handoff.md
            docs/generated/build-008-receipt.json
            docs/generated/project-memory.json
            docs/generated/known-gaps.json
            docs/generated/safety-capability-matrix.json
            docs/generated/eval-registry.json
            docs/generated/tool-inventory.json
            docs/generated/build-state.json
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Basic secret-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/ci.yml"
          aws_prefix="$(printf '\x41\x4b\x49\x41')"
          begin_word="$(printf '\x42\x45\x47\x49\x4e')"
          private_word="$(printf '\x50\x52\x49\x56\x41\x54\x45')"
          key_word="$(printf '\x4b\x45\x59')"
          secret_word="$(printf '\x73\x65\x63\x72\x65\x74')"
          pass_word="$(printf '\x70\x61\x73\x73\x77\x6f\x72\x64')"
          secret_like_patterns="(${aws_prefix}[0-9A-Z]{16}|${begin_word} (RSA|OPENSSH|EC|DSA) ${private_word} ${key_word}|${pass_word}=|client_${secret_word}=|${private_word}_${key_word}=)"
          if find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -type f \
            ! -path "$guard_file" \
            -print0 | xargs -0 grep -InE "$secret_like_patterns"; then
            echo "Potential secret-like string found."
            exit 1
          fi
