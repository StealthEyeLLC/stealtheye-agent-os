name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Scaffold and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report CI scope
        run: |
          echo "Build 10 CI: install, typecheck, tests, generated-state checks, required-file checks, and basic secret-string guard."
          echo "This workflow does not claim production deployment, public app submission, OAuth production readiness, durable ledger readiness, live repo-write testing, live browser testing, live worker testing, live replay readiness, or full security scanning."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check generated build state
        run: |
          node scripts/stealtheye-build.mjs scripts/phases/build-008-browserops.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-009-receipts-replay.mjs --check
          node scripts/stealtheye-build.mjs scripts/phases/build-010-mcp-runtime-devmode.mjs --check

      - name: Verify required scaffold files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md AGENTS.md llms.txt llms-full.txt package.json pnpm-workspace.yaml tsconfig.base.json
            packages/app-host/src/index.ts packages/app-host/src/tools.ts packages/app-host/src/resources.ts packages/app-host/test/app-host.test.ts
            packages/receipts-replay/src/index.ts packages/receipts-replay/src/events.ts packages/receipts-replay/test/receipts-replay.test.ts
            packages/mcp-runtime/package.json packages/mcp-runtime/tsconfig.json packages/mcp-runtime/src/index.ts packages/mcp-runtime/src/schemas.ts packages/mcp-runtime/src/server.ts packages/mcp-runtime/src/transport.ts packages/mcp-runtime/src/app-host-adapter.ts packages/mcp-runtime/src/tool-router.ts packages/mcp-runtime/src/resources.ts packages/mcp-runtime/src/receipts.ts packages/mcp-runtime/src/dev-mode.ts packages/mcp-runtime/src/fixtures.ts packages/mcp-runtime/test/mcp-runtime.test.ts
            scripts/stealtheye-build.mjs scripts/phases/build-008-browserops.mjs scripts/phases/build-009-receipts-replay.mjs scripts/phases/build-010-mcp-runtime-devmode.mjs
            docs/MCP_RUNTIME.md docs/DEV_MODE_CONNECTION.md docs/DECISIONS/0012-mcp-runtime-devmode-connection.md docs/BUILD_AUTOMATION.md docs/REPLAY.md docs/generated/build-010-manifest.json docs/generated/build-010-acceptance.md docs/generated/build-010-handoff.md docs/generated/build-010-receipt.json docs/generated/project-memory.json docs/generated/known-gaps.json docs/generated/safety-capability-matrix.json docs/generated/eval-registry.json docs/generated/tool-inventory.json docs/generated/build-state.json
          )
          for path in "${required[@]}"; do test -f "$path" || { echo "Missing required file: $path"; exit 1; }; done

      - name: Basic secret-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/ci.yml"
          aws_prefix="$(printf '\x41\x4b\x49\x41')"
          begin_word="$(printf '\x42\x45\x47\x49\x4e')"
          private_word="$(printf '\x50\x52\x49\x56\x41\x54\x45')"
          key_word="$(printf '\x4b\x45\x59')"
          secret_word="$(printf '\x73\x65\x63\x72\x65\x74')"
          pass_word="$(printf '\x70\x61\x73\x73\x77\x6f\x72\x64')"
          secret_like_patterns="(${aws_prefix}[0-9A-Z]{16}|${begin_word} (RSA|OPENSSH|EC|DSA) ${private_word} ${key_word}|${pass_word}=|client_${secret_word}=|${private_word}_${key_word}=)"
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f ! -path "$guard_file" -print0 | xargs -0 grep -InE "$secret_like_patterns"; then
            echo "Potential secret-like string found."
            exit 1
          fi
