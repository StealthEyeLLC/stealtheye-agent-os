name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Scaffold and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report CI scope
        run: |
          echo "Build 9 CI: install, typecheck, tests, required-file checks, basic secret-string guard, and generated build-state check."
          echo "This workflow does not claim full security scanning, SBOM/provenance, deployment readiness, durable ledger readiness, database-backed receipt storage, live replay execution, production artifact storage, live queue testing, worker runtime readiness, live browser testing, or live GitHub mutation testing."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check generated build state
        run: node scripts/stealtheye-build.mjs scripts/phases/build-009-receipts-replay.mjs --check

      - name: Verify required scaffold files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            llms.txt
            llms-full.txt
            package.json
            pnpm-workspace.yaml
            tsconfig.base.json
            scripts/stealtheye-build.mjs
            scripts/phases/build-008-browserops.mjs
            scripts/phases/build-009-receipts-replay.mjs
            packages/agent-registry/package.json
            packages/guard/package.json
            packages/mission-os/package.json
            packages/app-host/package.json
            packages/worker-fleet/package.json
            packages/codeops/package.json
            packages/browserops/package.json
            packages/receipts-replay/package.json
            packages/receipts-replay/tsconfig.json
            packages/receipts-replay/src/index.ts
            packages/receipts-replay/src/schemas.ts
            packages/receipts-replay/src/evidence.ts
            packages/receipts-replay/src/events.ts
            packages/receipts-replay/src/timeline.ts
            packages/receipts-replay/src/replay.ts
            packages/receipts-replay/src/final-report.ts
            packages/receipts-replay/src/verification.ts
            packages/receipts-replay/src/fixtures.ts
            packages/receipts-replay/test/receipts-replay.test.ts
            docs/ARCHITECTURE.md
            docs/AUTONOMY_MODEL.md
            docs/CODEOPS.md
            docs/CI_REPAIR.md
            docs/WORKER_FLEET.md
            docs/APP_HOST.md
            docs/MISSION_OS.md
            docs/BROWSEROPS.md
            docs/BUILD_AUTOMATION.md
            docs/REPLAY.md
            docs/SECURITY.md
            docs/WORKFLOWS.md
            docs/EVALS.md
            docs/RECEIPTS.md
            docs/BUILD_PROMPTS.md
            docs/CONTROL_MATRIX.md
            docs/generated/build-008-manifest.json
            docs/generated/build-008-acceptance.md
            docs/generated/build-008-handoff.md
            docs/generated/build-008-receipt.json
            docs/generated/build-009-manifest.json
            docs/generated/build-009-acceptance.md
            docs/generated/build-009-handoff.md
            docs/generated/build-009-receipt.json
            docs/generated/project-memory.json
            docs/generated/known-gaps.json
            docs/generated/safety-capability-matrix.json
            docs/generated/eval-registry.json
            docs/generated/tool-inventory.json
            docs/generated/build-state.json
            docs/DECISIONS/0010-browserops-build-automation.md
            docs/DECISIONS/0011-receipts-replay-foundation.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/workflows/ci.yml
            .github/CODEOWNERS
            SECURITY.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Basic secret-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/ci.yml"
          aws_prefix="$(printf '\x41\x4b\x49\x41')"
          begin_word="$(printf '\x42\x45\x47\x49\x4e')"
          private_word="$(printf '\x50\x52\x49\x56\x41\x54\x45')"
          key_word="$(printf '\x4b\x45\x59')"
          secret_word="$(printf '\x73\x65\x63\x72\x65\x74')"
          pass_word="$(printf '\x70\x61\x73\x73\x77\x6f\x72\x64')"
          secret_like_patterns="(${aws_prefix}[0-9A-Z]{16}|${begin_word} (RSA|OPENSSH|EC|DSA) ${private_word} ${key_word}|${pass_word}=|client_${secret_word}=|${private_word}_${key_word}=)"
          if find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -type f \
            ! -path "$guard_file" \
            -print0 | xargs -0 grep -InE "$secret_like_patterns"; then
            echo "Potential secret-like string found."
            exit 1
          fi
