name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Scaffold and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report CI scope
        run: |
          echo "Build 6 CI: scaffold checks plus real TypeScript package install, typecheck, and tests."
          echo "This workflow does not claim production security scanning, full supply-chain attestation, deployment readiness, live queue testing, Redis/BullMQ runtime testing, or worker runtime readiness yet."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify required scaffold files exist
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            llms.txt
            llms-full.txt
            package.json
            pnpm-workspace.yaml
            tsconfig.base.json
            packages/agent-registry/package.json
            packages/agent-registry/tsconfig.json
            packages/agent-registry/src/index.ts
            packages/agent-registry/src/schemas.ts
            packages/agent-registry/src/canonicalize.ts
            packages/agent-registry/src/digest.ts
            packages/agent-registry/src/signing.ts
            packages/agent-registry/src/diff.ts
            packages/agent-registry/src/registry.ts
            packages/agent-registry/src/revocation.ts
            packages/agent-registry/src/fixtures.ts
            packages/guard/package.json
            packages/guard/tsconfig.json
            packages/guard/src/index.ts
            packages/guard/src/schemas.ts
            packages/guard/src/capability-token.ts
            packages/guard/src/policy.ts
            packages/guard/src/hard-stops.ts
            packages/guard/src/decision.ts
            packages/guard/src/receipts.ts
            packages/guard/src/fixtures.ts
            packages/guard/test/guard.test.ts
            packages/mission-os/package.json
            packages/mission-os/tsconfig.json
            packages/mission-os/src/index.ts
            packages/mission-os/src/schemas.ts
            packages/mission-os/src/mission-language.ts
            packages/mission-os/src/mission.ts
            packages/mission-os/src/planning.ts
            packages/mission-os/src/authority-envelope.ts
            packages/mission-os/src/status.ts
            packages/mission-os/src/receipts.ts
            packages/mission-os/src/fixtures.ts
            packages/mission-os/test/mission-os.test.ts
            packages/app-host/package.json
            packages/app-host/tsconfig.json
            packages/app-host/src/index.ts
            packages/app-host/src/server.ts
            packages/app-host/src/tools.ts
            packages/app-host/src/tool-schemas.ts
            packages/app-host/src/resources.ts
            packages/app-host/src/app-metadata.ts
            packages/app-host/src/fixtures.ts
            packages/app-host/test/app-host.test.ts
            packages/worker-fleet/package.json
            packages/worker-fleet/tsconfig.json
            packages/worker-fleet/src/index.ts
            packages/worker-fleet/src/schemas.ts
            packages/worker-fleet/src/tasks.ts
            packages/worker-fleet/src/leases.ts
            packages/worker-fleet/src/idempotency.ts
            packages/worker-fleet/src/retry-policy.ts
            packages/worker-fleet/src/status.ts
            packages/worker-fleet/src/artifacts.ts
            packages/worker-fleet/src/receipts.ts
            packages/worker-fleet/src/preflight.ts
            packages/worker-fleet/src/fixtures.ts
            packages/worker-fleet/test/worker-fleet.test.ts
            docs/ARCHITECTURE.md
            docs/AUTONOMY_MODEL.md
            docs/CUSTOM_APPS.md
            docs/AGENT_REGISTRY.md
            docs/MISSION_OS.md
            docs/APP_HOST.md
            docs/WORKER_FLEET.md
            docs/SECURITY.md
            docs/WORKFLOWS.md
            docs/EVALS.md
            docs/RECEIPTS.md
            docs/BUILD_PROMPTS.md
            docs/COMPLIANCE.md
            docs/CONTROL_MATRIX.md
            docs/RISK_REGISTER.md
            docs/DATA_GOVERNANCE.md
            docs/PRIVACY.md
            docs/INCIDENT_RESPONSE.md
            docs/SECURE_SDLC.md
            docs/SUPPLY_CHAIN.md
            docs/AI_GOVERNANCE.md
            docs/EVIDENCE_MODEL.md
            docs/DECISIONS/0001-public-locked-down-repo-posture.md
            docs/DECISIONS/0002-default-technical-stack.md
            docs/DECISIONS/0003-high-autonomy-mission-scoped-authority.md
            docs/DECISIONS/0004-agent-registry-signed-manifests.md
            docs/DECISIONS/0005-guard-capability-tokens.md
            docs/DECISIONS/0006-mission-os-language.md
            docs/DECISIONS/0007-chatgpt-app-mcp-host-shell.md
            docs/DECISIONS/0008-worker-fleet-foundation.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/ISSUE_TEMPLATE/feature_request.md
            .github/ISSUE_TEMPLATE/bug_report.md
            .github/ISSUE_TEMPLATE/security_task.md
            .github/ISSUE_TEMPLATE/eval_task.md
            .github/ISSUE_TEMPLATE/architecture_decision.md
            .github/workflows/ci.yml
            .github/CODEOWNERS
            SECURITY.md
          )
          for path in "${required[@]}"; do
            test -f "$path" || { echo "Missing required file: $path"; exit 1; }
          done

      - name: Basic secret-string guard
        shell: bash
        run: |
          set -euo pipefail
          guard_file="./.github/workflows/ci.yml"
          secret_like_patterns='(AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|password=|client_secret=|PRIVATE_KEY=)'
          if find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -type f \
            ! -path "$guard_file" \
            -print0 | xargs -0 grep -InE "$secret_like_patterns"; then
            echo "Potential secret-like string found."
            exit 1
          fi
